[package]
name = "hsr-lang-patcher"
version = "1.1.2"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
anyhow = "1.0.104"
hex = "0.4.3"
inquire = "0.9.5"
varint-rs = { version = "2.2.1", features = ["signed"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"
